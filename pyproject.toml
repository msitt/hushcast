[project]
name = "hushcast"
dynamic = ["version"]
description = "Self-hosted podcast ad-removal server: transcribe, detect ads with an LLM, cut them out, serve clean RSS feeds."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.5",
    "aiosqlite==0.22.1",
    "alembic==1.20.0",
    "apscheduler==3.11.3",
    "httpx==0.28.1",
    "feedparser==6.0.14",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "python-slugify==8.0.4",
    "apprise==1.13.1",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/hushcast"]

[tool.hatch.version]
path = "backend/hushcast/__init__.py"

[tool.ruff]
target-version = "py314"
src = ["backend"]
extend-exclude = ["backend/hushcast/migrations/versions"]  # alembic-generated

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = [
    "E501", # line length, not enforced
    "B008", # function call in default argument, the FastAPI Depends() idiom
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = true
