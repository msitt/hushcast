[project]
name = "hushcast"
dynamic = ["version"]
description = "Self-hosted podcast ad-removal server: transcribe, detect ads with an LLM, cut them out, serve clean RSS feeds."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-slugify>=8.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/hushcast"]

[tool.hatch.version]
path = "backend/hushcast/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = true
