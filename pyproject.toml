[project]
name = "hushcast"
dynamic = ["version"]
description = "Self-hosted podcast ad-removal server: transcribe, detect ads with an LLM, cut them out, serve clean RSS feeds."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-slugify>=8.0",
    "apprise>=1.9",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/hushcast"]

[tool.hatch.version]
path = "backend/hushcast/__init__.py"

[tool.ruff]
target-version = "py314"
src = ["backend"]
extend-exclude = ["backend/hushcast/migrations/versions"]  # alembic-generated

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = [
    "E501", # line length, not enforced
    "B008", # function call in default argument, the FastAPI Depends() idiom
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = true
